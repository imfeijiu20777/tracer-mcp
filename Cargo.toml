[workspace]
resolver = "2"
members = ["tracer-common", "tracer-mcp","tracer-app/src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["you"]

[workspace.dependencies]
common = { path = "tracer-common", package = "tracer-common" }
iroh = "1.4.0"
iroh-blobs = "0.103.1"
iroh-tickets = "1.0.0"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = "0.3"
postcard = "1.1.3"
tracing = "0.1.44"
anyhow = "1.0.104"
futures-lite = "2.6.1"
serde = { version = "1", features = ["derive"] }
schemars = "1.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
